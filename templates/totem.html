<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Totem - Pegue sua senha</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1d23;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 { font-size: 24px; margin-bottom: 30px; }
        .botoes { display: flex; gap: 20px; }
        button {
            color: white;
            border: none;
            padding: 30px 40px;
            font-size: 22px;
            border-radius: 16px;
            cursor: pointer;
        }
        button:active { opacity: 0.8; }
        .btn-normal { background: #2b5fe0; }
        .btn-preferencial { background: #d4a017; }
        #esperando { font-size: 16px; color: #9297a3; margin-top: 30px; }

        /* O cupom fica escondido na tela normal, e só aparece formatado
           (via @media print) na hora de imprimir de verdade - é assim
           que o totem real do FEC imprime sem precisar de app nativo,
           só usando o print() do próprio navegador. */
        #cupom { display: none; }
        @media print {
            @page { size: 80mm auto; margin: 0; }
            body * { visibility: hidden; }
            #cupom, #cupom * { visibility: visible; }
            #cupom {
                display: block; position: absolute; top: 0; left: 0; width: 280px;
                font-family: 'Courier New', monospace; text-align: center;
            }
            #cupom .senha-grande { font-size: 52px; font-weight: 900; margin: 12px 0; }
            #cupom img { width: 130px; height: 130px; margin: 10px auto; }
        }
    </style>
</head>
<body>
    <h1>Toque numa opção para pegar sua senha</h1>
    <div class="botoes">
        <button class="btn-normal" onclick="pegarSenha('normal')">SENHA NORMAL</button>
        <button class="btn-preferencial" onclick="pegarSenha('preferencial')">SENHA PREFERENCIAL</button>
    </div>
    <div id="esperando"></div>

    <!-- Cupom impresso - só ganha conteúdo/aparece na hora de imprimir. -->
    <div id="cupom">
        <div class="senha-grande" id="cupom_senha"></div>
        <img id="cupom_qr" src="" alt="QR">
    </div>

    <script>
        async function pegarSenha(tipo) {
            const resposta = await fetch("/gerar", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ tipo: tipo }),
            });
            const dados = await resposta.json();
            imprimirCupom(dados.senha);
        }

        function imprimirCupom(senha) {
            document.getElementById("cupom_senha").textContent = senha;

            // Só manda imprimir depois que o QR terminou de carregar (ou
            // depois de 2s, se algo travar) - se mandasse imprimir antes,
            // o cupom podia sair com o QR em branco, ainda sem ter
            // chegado do servidor.
            const qr = document.getElementById("cupom_qr");
            let jaImprimiu = false;
            function imprimirAgora() {
                if (jaImprimiu) return;
                jaImprimiu = true;
                window.print();
            }
            qr.onload = imprimirAgora;
            qr.onerror = imprimirAgora;
            setTimeout(imprimirAgora, 2000);
            qr.src = "/qrcode.png?dados=" + encodeURIComponent(
                window.location.origin + "/sobre?s=" + senha
            );
        }

        async function atualizarContagem() {
            const resposta = await fetch("/status");
            const dados = await resposta.json();
            document.getElementById("esperando").textContent =
                dados.esperando_normal + " normal(is) e " +
                dados.esperando_preferencial + " preferencial(is) esperando";
        }
        setInterval(atualizarContagem, 3000);
        atualizarContagem();
    </script>
</body>
</html>
